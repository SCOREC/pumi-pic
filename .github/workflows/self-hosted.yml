name: self-hosted.yml

on:
  pull_request:
    branches:
      - master
  # Manual trigger
  workflow_dispatch:

jobs:
  build_and_test:
    # The asics environment is only for launching on self-hosted runners.
    # Do not use or edit this environment for any other purpose.
    environment: asics
    permissions:
      contents: read
    # The type of runner that the job will run on
    runs-on: [self-hosted, linux, x64, gpu]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: 'pumi-pic_${{ github.event.id }}' #under $GITHUB_WORKSPACE

      - name: build
        id: build
        shell: bash
        run: |
          set +e #avoid exiting when lua modules return non-zero on 'warning' messages
          source /etc/profile #provides module command
          module use /opt/scorec/spack/rhel9/v0222_2/lmod/linux-rhel9-x86_64/Core/
          module load gcc/13.2.0-4eahhas
          module load mpich/4.2.3-62uy3hd
          module load cuda/12.6.2-gqq65nw
          module load cmake
          set -e

          echo "github.workspace ${{github.workspace}}"

          date=`date +%F-%H-%M`
          workDir=${{github.workspace}}/pumi-picCI_${date}
          mkdir -p $workDir
          echo "PUMIPIC_WORK_DIR=$(echo $workDir)" >> $GITHUB_ENV
          echo "workDir $workDir"

          d=$workDir
          srcDir=${{github.workspace}}/pumi-pic_${{ github.event.id }}

          # install kokkos (fresh clone each run)
          git clone --branch 5.0.0 --depth 1 https://github.com/kokkos/kokkos.git $d/kokkos
          cmake -S $d/kokkos -B $d/build-kokkos \
            -DCMAKE_CXX_COMPILER=$d/kokkos/bin/nvcc_wrapper \
            -DCMAKE_INSTALL_PREFIX=$d/build-kokkos/install \
            -DKokkos_ARCH_TURING75=ON \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=OFF \
            -DKokkos_ENABLE_CUDA=ON \
            -DKokkos_ENABLE_CUDA_LAMBDA=ON \
            -DKokkos_ENABLE_IMPL_VIEW_LEGACY=ON \
            -DKokkos_ENABLE_DEBUG=ON
          cmake --build $d/build-kokkos -j 4 --target install

          # install omega_h (fresh clone each run)
          git clone https://github.com/SCOREC/omega_h.git $d/omega_h
          cmake -S $d/omega_h -B $d/build-omega_h \
            -DCMAKE_INSTALL_PREFIX=$d/build-omega_h/install \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_BUILD_TYPE=debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DOmega_h_USE_Kokkos=ON \
            -DOmega_h_USE_CUDA=ON \
            -DOmega_h_CUDA_ARCH=75 \
            -DOmega_h_USE_MPI=ON \
            -DBUILD_TESTING=ON \
            -DKokkos_PREFIX=$d/build-kokkos/install/lib64/cmake
          cmake --build $d/build-omega_h -j 4 --target install

          # install EnGPar (fresh clone each run)
          git clone https://github.com/SCOREC/EnGPar.git $d/EnGPar
          cmake -S $d/EnGPar -B $d/build-EnGPar \
            -DCMAKE_INSTALL_PREFIX=$d/build-EnGPar/install \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DENABLE_PARMETIS=OFF \
            -DENABLE_PUMI=OFF \
            -DIS_TESTING=OFF
          cmake --build $d/build-EnGPar -j 4 --target install

          # install Cabana (fresh clone each run)
          git clone https://github.com/ECP-copa/Cabana.git $d/Cabana
          cmake -S $d/Cabana -B $d/build-Cabana \
            -DCMAKE_INSTALL_PREFIX=$d/build-Cabana/install \
            -DKokkos_DIR=$d/build-kokkos/install/lib64/cmake/Kokkos \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_CXX_COMPILER=$d/kokkos/bin/nvcc_wrapper \
            -DCabana_ENABLE_TESTING=OFF \
            -DCabana_ENABLE_EXAMPLES=OFF
          cmake --build $d/build-Cabana -j 4 --target install

          # download testcases (fresh clone each run)
          git clone https://github.com/SCOREC/pumipic-data.git $d/pumipic-data

          cmake -S $srcDir -B $d/build-pumi-pic \
            -DCMAKE_INSTALL_PREFIX=$d/build-pumi-pic/install \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DENABLE_CABANA=ON \
            -DCMAKE_CXX_STANDARD=20 \
            -DTEST_DATA_DIR=$d/pumipic-data \
            -DOmega_h_PREFIX=$d/build-omega_h/install \
            -DEnGPar_PREFIX=$d/build-EnGPar/install \
            -DCabana_PREFIX=$d/build-Cabana/install \
            -DIS_TESTING=ON \
            -DBUILD_TESTING=ON \
            -DPS_IS_TESTING=ON
          cmake --build $d/build-pumi-pic -j 8 --target install
          ctest --test-dir $d/build-pumi-pic --output-on-failure

      - name: Cleanup
        if: ${{ !cancelled() }}
        run: |
          echo "PUMIPIC_WORK_DIR $PUMIPIC_WORK_DIR"
          rm -rf $PUMIPIC_WORK_DIR
